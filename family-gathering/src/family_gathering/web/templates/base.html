<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ meta.title }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div class="wrap">
      <h1>{{ meta.title }}</h1>
      <p class="meta-line">
        <span>{{ meta.when }}</span>
        <span class="dot">·</span>
        <span>{{ meta.where }}</span>
      </p>
      {% if meta.note %}
      <p class="note">{{ meta.note }}</p>
      {% endif %}
    </div>
  </header>

  <main class="wrap">
    {% if flash_msg %}
    <div class="flash flash--ok">{{ flash_msg }}</div>
    {% endif %}
    {% if flash_error %}
    <div class="flash flash--err">{{ flash_error }}</div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <footer class="footer wrap">
    <a href="/docs" target="_blank">API 文档</a>
  </footer>
</body>
</html>
